name: Stragy 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes 24/7 to prevent Render cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Stragy Endpoint
        run: |
          echo "Pinging Stragy on Render..."
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 "https://stragy.onrender.com/" || echo "PING_SENT")
          echo "Ping result: $HTTP_STATUS"
          exit 0