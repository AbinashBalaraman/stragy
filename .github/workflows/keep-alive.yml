name: Manual public demo liveness check

# An explicit check, not uptime monitoring or a guarantee against cold starts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Stragy Endpoint
        run: |
          curl --fail --show-error --silent --connect-timeout 15 --max-time 60 "https://stragy.onrender.com/health/live"
          echo "Public demo liveness endpoint returned a successful status."