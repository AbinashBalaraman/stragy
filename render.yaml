services:
  - type: web
    name: stragy
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: HOST
        value: 0.0.0.0
      - key: EXPOSURE_MODE
        value: private
      - key: DATA_MODE
        value: real
      - key: MARKET_PROVIDER
        value: angel
      # Owner's Angel One account, read-only live quotes and daily candle history.
      - key: QUOTES_PROVIDER
        value: angel
      - key: SITE_USER
        value: owner
      - key: SITE_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: opencode-go
      - key: AI_MODEL
        value: hy4-flash-free
      - key: AI_FALLBACK_MODELS
        value: openrouter:openrouter/free,opencode-go:deepseek-v4.1-flash
      - key: AI_APPROVED_PAID_MODELS
        value: opencode-go:deepseek-v4.1-flash
      - key: AI_COST_POLICY
        value: free-only
      - key: AI_TIMEOUT_MS
        value: 60000
      - key: AI_MAX_OUTPUT_TOKENS
        value: 2000
      - key: AI_MAX_REQUESTS_PER_HOUR
        value: 12
      - key: MAX_JOB_MS
        value: 90000
      - key: MAX_QUEUE
        value: 4
      - key: STORAGE_MODE
        value: ephemeral
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PROVIDER_SECRETS_KEY
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PASSWORD
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false

